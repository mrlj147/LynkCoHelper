name: Daily AppSecret Refresh

on:
  schedule:
    # Daily at 00:37 Asia/Shanghai; GitHub schedules can be delayed.
    - cron: '37 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-appsecret-refresh
  cancel-in-progress: false

jobs:
  extract:
    if: github.repository == 'mrlj147/LynkCoHelper' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extraction dependencies
        run: python -m pip install pexpect pycryptodome==3.24.0 pyyaml
      - name: Validate key delivery before extraction
        run: python -m unittest discover -s tests -v
      - name: Enable KVM acceleration
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Extract keys from the latest official APK
        env:
          EMU_HEADLESS: '1'
          LYNKCO_AUTO_WRITE: '1'
          LYNKCO_IMAGE_ABI: x86_64
          LYNKCO_APK_SOURCE: official
        run: |
          umask 077
          python LynkCoHelper/tools/extract_appsecret_github_action.py
      - name: Encrypt and validate extracted keys
        run: |
          umask 077
          python LynkCoHelper/tools/appsecret_bundle.py seal \
            --env-file LynkCoHelper/env.json \
            --public-key LynkCoHelper/tools/appsecret-recipient.pub.pem \
            --output appsecret.bundle.json
      - name: Publish encrypted latest keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view appsecret-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create appsecret-latest --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title 'Encrypted daily AppSecret' \
              --notes 'Encrypted application keys. No account credentials or plaintext keys are published.'
          fi
          gh release upload appsecret-latest appsecret.bundle.json \
            --repo "$GITHUB_REPOSITORY" --clobber
      - name: Remove plaintext keys
        if: always()
        run: rm -f LynkCoHelper/env.json
      - name: Record delivery status
        if: success()
        run: |
          echo 'Daily extraction completed. Validated encrypted keys are available in the appsecret-latest release.' >> "$GITHUB_STEP_SUMMARY"
